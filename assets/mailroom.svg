<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- mailroom 图标：分信格（pigeonholes）+ 一封等着处理的信。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34415C"/>
      <stop offset="1" stop-color="#1B2331"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 分信格墙 -->
  <rect x="152" y="152" width="720" height="720" rx="80" fill="#F4EFE4"/>

  <!-- 四个格子（洞） -->
  <rect x="216" y="216" width="280" height="280" rx="36" fill="#232C3D"/>
  <rect x="528" y="216" width="280" height="280" rx="36" fill="#232C3D"/>
  <rect x="216" y="528" width="280" height="280" rx="36" fill="#232C3D"/>
  <rect x="528" y="528" width="280" height="280" rx="36" fill="#232C3D"/>

  <!-- 右上格里那封信：微微翘起，探出格口 -->
  <g transform="rotate(-7 668 350)">
    <rect x="548" y="196" width="240" height="168" rx="18" fill="url(#env)"/>
    <path d="M548 214 L668 306 L788 214" fill="none" stroke="#C77F17" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 格口下沿压在信上，做出「插在格子里」的层次 -->
  <rect x="528" y="392" width="280" height="104" rx="36" fill="#232C3D"/>
  <rect x="528" y="380" width="280" height="40" fill="#232C3D"/>
</svg>
